[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The decoders take a lot of flash, so use the bigger app partition (no OTA).
board_build.partitions = huge_app.csv
lib_ldf_mode = chain+
lib_deps =
    https://github.com/NorthernMan54/rtl_433_ESP.git#566fbf4
    https://github.com/1technophile/Arduino-Log.git#d13cd80aa02c8cf79a33ca24c554ed3331c3679f
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
build_flags =
    -DLOG_LEVEL=LOG_LEVEL_SILENT
    ; CC1101 wiring (see WIRING.html). SPI uses the ESP32's standard pins:
    ; SCK 18, MISO 19, MOSI 23.
    -DRF_CC1101=\"CC1101\"
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=13
    -DRF_MODULE_GDO2=4
    -DRF_MODULE_FREQUENCY=433.92
    -DOOK_MODULATION=true

; ESP32-S3-N16R8 board, CC1101 wired to the S3's default SPI pins (see README).
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
extra_scripts = pre:patch_radiolib.py
lib_ldf_mode = chain+
lib_deps =
    https://github.com/NorthernMan54/rtl_433_ESP.git#566fbf4
    https://github.com/1technophile/Arduino-Log.git#d13cd80aa02c8cf79a33ca24c554ed3331c3679f
    bblanchon/ArduinoJson@^7
    knolleary/PubSubClient@^2.8
build_flags =
    ; NOTICE prints radio start-up problems on the serial monitor; SILENT turns it off.
    -DLOG_LEVEL=LOG_LEVEL_NOTICE
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRF_CC1101=\"CC1101\"
    -DRF_MODULE_CS=10
    -DRF_MODULE_GDO0=4
    -DRF_MODULE_GDO2=5
    -DRF_MODULE_SCK=12
    -DRF_MODULE_MISO=13
    -DRF_MODULE_MOSI=11
    -DRF_MODULE_FREQUENCY=433.92
    -DOOK_MODULATION=true
